[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-agent"
version = "0.1.0"
description = "Multi-source reconciliation agent: invoices, gateway settlements, bank statement"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sakash Srivastava" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rapidfuzz>=3.6",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
recon = "recon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
